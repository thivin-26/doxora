services:
  - type: web
    name: doxora-backend
    env: python
    rootDir: documind-backend/documind
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: FLASK_DEBUG
        value: "false"
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: OPENROUTER_API_KEY
        sync: false
